[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bazis-woodworker-mcp"
version = "0.2.2"
description = "Local MCP bridge for the legacy BAZIS Woodworker scripting API"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "pydantic==2.12.5", "pydantic-settings==2.12.0", "tomlkit>=0.13,<1"]

[project.scripts]
bazis-mcp = "bazis_mcp.server:main"

[tool.setuptools.packages.find]
include = ["bazis_mcp*"]

